server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular es una SPA: cualquier ruta que no sea un archivo real
    # debe devolver index.html para que el router de Angular la maneje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que empiece por /api se envia al backend.
    # "backend" es el nombre del servicio en docker-compose.yml;
    # Docker lo resuelve automaticamente, no es una IP fija.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con hash en el nombre (los .js/.css generados por Angular)
    # pueden cachearse agresivamente sin riesgo.
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
